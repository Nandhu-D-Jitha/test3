<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classy Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="clock-container">
        <div class="glass-panel">
            <div class="time-wrapper">
                <span id="hours" class="time-value">--</span>
                <span class="colon">:</span>
                <span id="minutes" class="time-value">--</span>
                <span class="colon">:</span>
                <span id="seconds" class="time-value seconds">--</span>
                <span id="ampm" class="ampm">AM</span>
            </div>
            <div id="date" class="date-display">Gathering temporal data...</div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
